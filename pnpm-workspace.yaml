engineStrict: true

# Packages allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  esbuild: true
  sharp: true

# Vite+ ships its own Vite core; alias it so Astro and vite-plus share one copy.
overrides:
  vite@*: "catalog:"

# vitest declares a vite@^6–8 peer; the vite-plus core alias above reports 1.4.0.
peerDependencyRules:
  allowedVersions:
    vite: "*"
  allowAny:
    - vite

minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.4.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.4.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.4.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.4.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.4.0"
  - vite-plus@1.4.0
  - astro@7.4.5 || 7.4.7
  - "@astrojs/internal-helpers@0.13.1"
  - "@astrojs/markdown-satteri@0.4.7"
  - "@playwright/test@1.65.0"
  - playwright-core@1.65.0
  - playwright@1.65.0
  - "@astrojs/compiler-binding-android-arm64@0.5.3"
  - "@astrojs/compiler-binding-darwin-arm64@0.5.3"
  - "@astrojs/compiler-binding-darwin-x64@0.5.3"
  - "@astrojs/compiler-binding-linux-arm64-gnu@0.5.3"
  - "@astrojs/compiler-binding-linux-arm64-musl@0.5.3"
  - "@astrojs/compiler-binding-linux-x64-gnu@0.5.3"
  - "@astrojs/compiler-binding-linux-x64-musl@0.5.3"
  - "@astrojs/compiler-binding-wasm32-wasi@0.5.3"
  - "@astrojs/compiler-binding-win32-arm64-msvc@0.5.3"
  - "@astrojs/compiler-binding-win32-x64-msvc@0.5.3"
  - "@astrojs/compiler-binding@0.5.3"
  - "@astrojs/compiler-rs@0.5.3"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
